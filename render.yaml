services:
  - type: web
    name: greenlie-api
    runtime: python
    plan: free
    buildCommand: pip install -e ./engine && pip install -r api/requirements.txt
    startCommand: cd api && PYTHONPATH="../engine:." uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
