[project]
name = "greenlie"
version = "0.1.0"
description = "Detektor assertion weakening saat agent memperbaiki CI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adinda Panca Mochamad" }]
dependencies = [
  "click>=8.1",
]

[project.scripts]
greenlie = "greenlie.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
